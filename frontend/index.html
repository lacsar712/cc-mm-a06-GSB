<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    nav button { background: #57534e; color: #f5f5f4; border: 0; padding: 6px 12px; cursor: pointer; }
    nav button.active { background: #b45309; }
    main { max-width: 820px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; font-weight: bold; } .ok { color: #86efac; }
    .muted { color: #a8a29e; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .heat-high { background: #7f1d1d; }
    .heat-mid { background: #78350f; }
    .heat-zero { color: #a8a29e; }
    .snaplink { color: #93c5fd; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav id="nav" hidden>
      <button id="tab-readings" class="active">班测记录</button>
      <button id="tab-heat">巷道热力</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>

    <section id="view-readings" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
    </section>

    <section id="view-heat" hidden>
      <h2>巷道报警热力文字表</h2>
      <p class="muted">按巷道名前若干个字分组统计，纯文字表，没有图。</p>

      <div id="heat-live">
        <div id="prefix-box">
          <label>前缀长度（字）</label>
          <input id="prefix-len" type="number" min="1" max="20" style="width: 5em;" />
          <button id="save-prefix">保存前缀长度</button>
          <button id="issue-snapshot">签发热力快照</button>
          <span id="heat-msg" class="muted"></span>
        </div>
        <p class="muted">现场表随时跟随当前前缀长度重新统计。</p>
        <table>
          <thead><tr><th>巷道前缀</th><th>报警条数</th><th>正常条数</th><th>命中行编号</th></tr></thead>
          <tbody id="heat-rows"></tbody>
        </table>
      </div>

      <div id="heat-snapshot" hidden>
        <button id="snap-back">← 返回现场表</button>
        <h3>快照 <span id="snap-title"></span></h3>
        <p id="snap-meta" class="muted"></p>
        <table>
          <thead><tr><th>巷道前缀</th><th>报警条数</th><th>正常条数</th><th>命中行编号</th></tr></thead>
          <tbody id="snap-rows"></tbody>
        </table>
      </div>

      <h3>已签发快照</h3>
      <table>
        <thead><tr><th>编号</th><th>冻结前缀长度</th><th>前缀组数</th><th>签发人</th><th>签发时间</th><th></th></tr></thead>
        <tbody id="snap-list"></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
