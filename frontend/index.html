<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    header nav button { background: #292524; color: #f5f5f4; border: 1px solid #57534e; }
    header nav button.active { background: #b45309; border-color: #b45309; }
    main { max-width: 860px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    button { cursor: pointer; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    .hot { font-weight: bold; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .muted { color: #a8a29e; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
    .hitids { font-family: monospace; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav id="nav" hidden>
      <button id="nav-shift" class="active">班测记录</button>
      <button id="nav-heat">巷道热力</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>

    <section id="shift" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <table><thead><tr><th>编号</th><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
    </section>

    <section id="heat" hidden>
      <div id="heat-live-view">
        <h2>巷道热力（现场表）</h2>
        <p class="muted">按巷道名前若干字分组，统计报警条数与正常条数。纯文字，不出图。</p>
        <div class="toolbar">
          <label>前缀长度
            <input id="prefix-len" type="number" min="1" max="8" />
          </label>
          <button id="save-prefix" hidden>保存前缀长度</button>
          <button id="issue-snap" hidden>签发热力快照</button>
          <span id="heat-msg" class="muted"></span>
        </div>
        <table>
          <thead><tr><th>前缀</th><th>报警条数</th><th>正常条数</th><th>命中行编号</th></tr></thead>
          <tbody id="heat-rows"></tbody>
        </table>
        <h3>已签发快照</h3>
        <table>
          <thead><tr><th>编号</th><th>前缀长度</th><th>签发人</th><th>签发时间</th><th>命中行编号</th><th></th></tr></thead>
          <tbody id="snap-rows"></tbody>
        </table>
      </div>

      <div id="heat-snap-view" hidden>
        <button id="snap-back">← 返回现场表</button>
        <h2>热力快照 #<span id="snap-id"></span></h2>
        <p class="muted">
          冻结于 <span id="snap-time"></span>，签发人 <span id="snap-by"></span>，
          前缀长度固定为 <strong id="snap-len"></strong>。之后调整前缀长度不影响本快照。
        </p>
        <table>
          <thead><tr><th>前缀</th><th>报警条数</th><th>正常条数</th><th>命中行编号</th></tr></thead>
          <tbody id="snap-groups"></tbody>
        </table>
        <p>全部命中行编号：<span id="snap-hits" class="hitids"></span></p>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
